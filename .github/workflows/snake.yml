name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # alle 12h aktualisieren
  workflow_dispatch:          # manuell startbar (Actions-Tab → Run workflow)
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ObeyCray
          outputs: |
            dist/snake.svg?color_snake=c6ff00&color_dots=0a0a0a,2a3a00,5a7a00,8ab800,c6ff00

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
